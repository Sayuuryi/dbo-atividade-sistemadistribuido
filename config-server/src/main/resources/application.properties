spring.application.name=config-server
server.port=8888

# IMPORTANTE: crie o repositorio repo-configs no GitHub e troque a URL abaixo
# se o seu usuario do GitHub for diferente de Sayuuryi.
spring.cloud.config.server.git.uri=https://github.com/Sayuuryi/dbo-sistemadistribuido-config.git
spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.clone-on-start=true

management.endpoints.web.exposure.include=*
